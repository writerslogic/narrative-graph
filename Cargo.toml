[package]
name = "narrative-graph"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
authors = ["WritersLogic, Inc. <david@writerslogic.com>"]
description = "Turn prose into candidate relational facts — entity detection, relation labeling, confidence scoring, entirely local."
repository = "https://github.com/writerslogic/narrative-graph"
homepage = "https://github.com/writerslogic/narrative-graph"
documentation = "https://docs.rs/narrative-graph"
keywords = ["nlp", "relation-extraction", "entity-extraction", "heuristics", "semantic"]
categories = ["text-processing", "science"]
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "3.9", features = ["async", "serde-json"], optional = true }
napi-derive = { version = "3.5", optional = true }
serde = { version = "1.0", features = ["derive"] }
ts-rs = { version = "12", features = ["serde-compat"] }
schemars = { version = "1.2", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
regex = "1"
anyhow = "1.0"
clap = { version = "4.4", features = ["derive"], optional = true }

[build-dependencies]
napi-build = { version = "2.2", optional = true }

[dev-dependencies]

[features]
default = []
node-api = ["napi", "napi-derive", "napi-build"]
cli = ["clap"]

[[bin]]
name = "narrative-graph"
path = "src/bin/main.rs"
required-features = ["cli"]

[profile.release]
lto = true
strip = true
opt-level = 3
