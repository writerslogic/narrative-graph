[package]
name = "narrative-graph"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "Apache-2.0"
authors = ["WritersLogic, Inc. <david@writerslogic.com>"]
description = "Turn prose into candidate relational facts — entity detection, relation labeling, confidence scoring, entirely local."
repository = "https://github.com/writerslogic/narrative-graph"
homepage = "https://github.com/writerslogic/narrative-graph"
documentation = "https://docs.rs/narrative-graph"
keywords = ["nlp", "relation-extraction", "entity-extraction", "heuristics", "semantic"]
categories = ["text-processing", "science"]
readme = "README.md"

# Every public surface beyond the heuristic core sits behind an opt-in feature,
# so the default build docs.rs would otherwise render omits it.
[package.metadata.docs.rs]
features = ["json", "bindings"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "3.9", features = ["async", "serde-json"], optional = true }
napi-derive = { version = "3.5", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
ts-rs = { version = "12", features = ["serde-compat"], optional = true }
serde_json = { version = "1.0", optional = true }
anyhow = { version = "1.0", optional = true }
clap = { version = "4.4", features = ["derive"], optional = true }

[build-dependencies]
napi-build = { version = "2.2", optional = true }

[dev-dependencies]

# The default build is dependency-free: the heuristic pipeline compiles against
# the standard library alone. Every dependency below is opt-in, and exists only
# to serve a boundary (JSON, TypeScript bindings, N-API, CLI) rather than the
# extraction core.
[features]
default = []
serde = ["dep:serde"]
json = ["serde", "dep:serde_json"]
bindings = ["serde", "dep:ts-rs"]
node-api = ["dep:napi", "dep:napi-derive", "dep:napi-build", "bindings", "json"]
cli = ["dep:clap", "dep:anyhow", "json"]

[[bin]]
name = "narrative-graph"
path = "src/bin/main.rs"
required-features = ["cli"]

[profile.release]
lto = true
strip = true
opt-level = 3
