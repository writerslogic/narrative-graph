name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      with:
        components: clippy, rustfmt

    - name: Cache cargo
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Format Check
      run: cargo fmt -- --check

    - name: Lint (Clippy)
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: Run Tests
      run: cargo test --all-features --verbose

    - name: Corpus snapshots and real-text eval
      run: cargo test --release --test corpus --test real_text_eval -- --include-ignored

  msrv:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      with:
        toolchain: '1.77'
    - run: cargo check

  # The default build is dependency-free by design. Fail if anything but the
  # crate itself appears in the default dependency graph.
  dependency-free:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
    - name: Assert no default dependencies
      run: |
        set -euo pipefail
        deps=$(cargo tree --edges normal --prefix none | sed '/^$/d' | tail -n +2)
        if [ -n "$deps" ]; then
          echo "Default build gained dependencies:"
          echo "$deps"
          exit 1
        fi
        echo "Default build is dependency-free."

  deny:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
      with:
        arguments: --all-features

  coverage:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      with:
        components: llvm-tools-preview
    - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
      with:
        tool: cargo-llvm-cov
    - name: Line coverage of the test suite
      run: cargo llvm-cov --all-features --summary-only --fail-under-lines 85

  # A short run of the fuzz target on every change; longer runs are local.
  fuzz:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      with:
        toolchain: nightly
    - run: cargo install cargo-fuzz --locked
    - name: Fuzz extract_triples for two minutes
      working-directory: fuzz
      run: cargo +nightly fuzz run extract_triples -- -max_total_time=120

  build-napi:
    runs-on: ubuntu-latest
    needs: check
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

    - name: Install Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm ci --omit=optional

    - name: Build Release
      run: npm run build

    - name: Run Node tests
      run: npm test

    - name: Check TypeScript types
      run: npm run test:types
